<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Análises</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <header class="cabecalho">
            <h1>Gerenciamento de Análises</h1>
            <button
                id="alternarTema"
                class="botao botao-tema">
                <span class="icone-tema">☾</span>
                <span class="texto-tema">Tema escuro</span>
            </button>
        </header>

        <main class="container">

            <div class="pagina-header">
                <a class="botao" th:href="@{/}">Início</a>
                <a class="botao" th:href="@{/filmes}">Filmes</a>
            </div>

            <div id="mensagem" class="mensagem"></div>

            <section class="formulario">

                <h2 id="tituloFormulario">Cadastrar análise</h2>

                <form id="analiseForm">

                    <input type="hidden" id="analiseId">

                    <div class="campo">
                        <label for="filme">Filme</label>

                        <select id="filme" required>
                            <option value="">
                                Selecione um filme
                            </option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="nota">Nota</label>
                        <input type="number" id="nota" min="0" max="10" step="1" required>
                    </div>

                    <div class="campo">
                        <label for="comentario">Comentário</label>
                        <textarea id="comentario" rows="5" required></textarea>
                    </div>

                    <button
                        type="submit"
                        class="botao">
                        Salvar análise
                    </button>

                    <button
                        type="button"
                        id="cancelarEdicao"
                        class="botao oculto">
                        Cancelar edição
                    </button>

                </form>

            </section>
            <section>

                <h2>Análises cadastradas</h2>

                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Filme</th>
                                <th>Nota</th>
                                <th>Comentário</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="analisesTabela">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script th:src="@{/js/analises.js}"></script>
        <script th:src="@{/js/theme.js}"></script>
    </body>
</html>
