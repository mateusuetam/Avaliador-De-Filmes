<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Adicionar Análise</title>
    </head>
    <body>

        <h1>Adicionar Análise</h1>

        <h2 th:text="${filme.titulo}"></h2>

        <p> Diretor: <span th:text="${filme.diretor}"></span> </p>
        <p> Ano: <span th:text="${filme.anoLancamento}"></span> </p>

        <form th:action="@{/analises}" th:object="${analise}" method="post">

            <input type="hidden" name="filmeId" th:value="${filme.id}">

            <div>
                <label for="nota">Nota (0 a 10):</label>
                <input
                    type="number"
                    id="nota"
                    th:field="*{nota}"
                    min="0"
                    max="10"
                    required>
            </div>

            <br>

            <div>
                <label for="comentario">Comentário:</label>
                <br>
                <textarea
                    id="comentario"
                    th:field="*{comentario}"
                    rows="6"
                    cols="50"
                    required></textarea>
            </div>

            <br>

            <button type="submit">Adicionar análise</button>

        </form>

        <p>
            <a th:href="@{/filmes}">Voltar para filmes</a>
        </p>

    </body>
</html>
