<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Filmes</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>

        <header class="cabecalho">
            <h1>Gerenciamento de Filmes</h1>
        </header>

        <main class="container">

            <div class="pagina-header">
                <a class="botao" th:href="@{/}">Início</a>
                <a class="botao" th:href="@{/analises}">Análises</a>
            </div>

            <div id="mensagem" class="mensagem"></div>

            <section class="formulario">
                <h2 id="tituloFormulario">Cadastrar filme</h2>

                <form id="filmeForm">
                    <input type="hidden" id="filmeId">

                    <div class="campo">
                        <label for="titulo">Título</label>
                        <input type="text" id="titulo" required>
                    </div>

                    <div class="campo">
                        <label for="diretor">Diretor</label>
                        <input type="text" id="diretor" required>
                    </div>

                    <div class="campo">
                        <label for="anoLancamento">Ano de lançamento</label>
                        <input type="number" id="anoLancamento" min="1888" max="2100" required>
                    </div>

                    <div class="campo">
                        <label>
                            <input type="checkbox" id="assistido">
                            Filme assistido
                        </label>
                    </div>

                    <button
                        type="submit"
                        class="botao">
                        Salvar filme
                    </button>

                    <button
                        type="button"
                        id="cancelarEdicao"
                        class="botao oculto">
                        Cancelar edição
                    </button>

                </form>

            </section>
            <section>

                <h2>Filmes cadastrados</h2>

                <div class="tabela-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Diretor</th>
                                <th>Ano</th>
                                <th>Assistido</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="filmesTabela">
                        </tbody>
                    </table>
                </div>

            </section>
        </main>
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
        <script th:src="@{/js/filmes.js}"></script>
    </body>
</html>
